<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Heavy Base</title>
<meta name="description" content="Heavy Base. Be hard to move. A strength training log.">
<meta name="theme-color" content="#17150F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Heavy Base">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:ital,wght@0,400;0,600;0,800;1,800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Heavy Base. One phone-width column on iron: wordmark and program position up top, lift cards with
   tap-to-log plate discs, rest timer docked above a bottom tab bar. Deliberately a single dark look.
   Red and gold are used like tape on a bar: small and on purpose. Numbers are IBM Plex Mono. */
:root {
  --iron: #17150F; --rubber: #24211A; --plate: #36322A; --chalk: #ECE6D8; --chalk-dim: #ADA595; --red: #C62A1E; --gold: #E3A41F;
  --bg: var(--iron); --surface: var(--rubber); --sunk: #1D1B14; --fg: var(--chalk); --muted: var(--chalk-dim); --line: var(--plate);
  --accent: var(--gold); --accent-fg: var(--iron); --good: var(--gold); --good-bg: rgba(227,164,31,.14); --bad: #E0483B; --bad-bg: rgba(198,42,30,.2);
  --p45: var(--red); --p35: var(--gold); --p25: var(--chalk); --p10: var(--plate); --plate-fg: var(--chalk);
  --display: "Big Shoulders Display", "Impact", "Arial Narrow Bold", sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tabs-h: 60px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
::selection { background: var(--gold); color: var(--iron); }
.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 18px calc(var(--tabs-h) + 130px); display: flex; flex-direction: column; gap: 14px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
strong { font-weight: 800; }

/* header: stacked wordmark, the FlyTy lockup, singlet stripes, then where you are in the program */
.top { display: flex; flex-direction: column; gap: 8px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wm { font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: .8; font-size: 44px; letter-spacing: .005em; transform: skewX(-9deg); transform-origin: left bottom; margin: 0; }
.wm span { display: block; color: var(--chalk); }
.wm span + span { color: var(--gold); }
.lock { display: flex; align-items: center; gap: 10px; flex: none; }
.lock .x { font-family: var(--mono); font-weight: 700; font-size: 20px; color: var(--red); line-height: 1; }
.logo { width: 60px; height: 60px; border-radius: 50%; background: var(--chalk); display: grid; place-items: center; padding: 5px; overflow: hidden; flex: none; }
.logo img { width: 100%; height: auto; display: block; }
.tag { font-family: var(--body); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: 13px; letter-spacing: .04em; color: var(--chalk-dim); }
.stripes { display: flex; flex-direction: column; gap: 3px; transform: skewX(-14deg); transform-origin: left bottom; margin: 2px 0 6px; }
.stripes i { display: block; height: 5px; }
.stripes i:nth-child(1) { background: var(--red); }
.stripes i:nth-child(2) { background: var(--gold); }
.stripes i:nth-child(3) { background: var(--chalk); }
.eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--display); font-weight: 900; font-size: 46px; line-height: .92; margin: 0; text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1; margin: 0; text-transform: uppercase; letter-spacing: .01em; }
.prog { height: 6px; background: var(--rubber); overflow: hidden; margin-top: 2px; }
.prog > i { display: block; height: 100%; background: var(--gold); }

#view { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.lift-name { font-family: var(--display); font-weight: 900; font-size: 28px; text-transform: uppercase; line-height: .95; letter-spacing: .005em; }
.scheme { color: var(--muted); font-size: 14px; }
.note { color: var(--muted); font-size: 14px; }
.banner { background: var(--sunk); border-left: 4px solid var(--red); padding: 12px 14px; font-size: 15px; }
.banner strong { color: var(--gold); }

.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .val { min-width: 96px; text-align: center; font-family: var(--mono); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.stepper .val small { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 3px; letter-spacing: 0; text-transform: uppercase; }
.sq { width: 44px; height: 44px; border-radius: 2px; border: 2px solid var(--line); background: var(--iron); font-size: 22px; font-weight: 600; line-height: 1; color: var(--chalk); }
.sq:active { background: var(--plate); }

.plates { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.plate { font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: 0; color: var(--plate-fg); padding: 2px 7px; border-radius: 2px; background: var(--p10); font-variant-numeric: tabular-nums; }
.plate.p45 { background: var(--p45); } .plate.p35 { background: var(--p35); color: var(--iron); } .plate.p25 { background: var(--p25); color: var(--iron); }

/* set discs read like plates on a bar: empty ring, gold when every rep is in, red when short */
.sets { display: flex; gap: 10px; flex-wrap: wrap; }
.set { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--plate); background: var(--iron); color: var(--muted);
  font-family: var(--mono); font-weight: 700; font-size: 21px; font-variant-numeric: tabular-nums;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.set.full { background: var(--gold); border-color: var(--gold); color: var(--iron); }
.set.part { background: var(--bad-bg); border-color: var(--red); color: var(--chalk); }
.set.editing { outline: 3px solid var(--chalk); outline-offset: 2px; }
.erbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--sunk); border: 1px solid var(--line); padding: 10px; }
input.erin[type="number"] { width: 84px; min-height: 44px; text-align: center; font-family: var(--mono); font-weight: 700; font-size: 26px; padding: 2px 4px; }

.chip { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; background: var(--plate); color: var(--chalk-dim); }
.chip.ov { background: var(--red); color: var(--chalk); }
.ovcard { border-color: var(--red); border-width: 1px; border-left-width: 5px; }
.nt { white-space: pre-wrap; overflow-wrap: anywhere; }
textarea { width: 100%; font-family: var(--body) !important; letter-spacing: 0; text-transform: none; min-height: 88px; padding: 8px 10px; border-radius: 2px; border: 1px solid var(--line); background: var(--iron); color: var(--fg); font: inherit; font-size: 16px; resize: vertical; }
.chip.good { background: var(--gold); color: var(--iron); }
.chip.bad { background: var(--red); color: var(--chalk); }

.btn { min-height: 48px; padding: 10px 16px; border-radius: 2px; border: 2px solid var(--line); background: transparent; color: var(--chalk); font-family: var(--display); font-weight: 900; font-size: 19px; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.btn:active { background: var(--plate); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--iron); font-size: 24px; letter-spacing: .03em; min-height: 54px; }
.btn.primary:active { background: #C98F14; }
.btn.danger { color: var(--chalk); background: var(--red); border-color: var(--red); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 16px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 140px; }
.btns > .btn.primary { font-size: 21px; white-space: nowrap; }

.field { display: flex; flex-direction: column; gap: 5px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; }
select, input[type="number"], input[type="text"] { width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 2px; border: 1px solid var(--line); background: var(--iron); color: var(--fg); font-family: var(--body); font-size: 16px; letter-spacing: 0; text-transform: none; }
input[type="number"] { font-family: var(--mono); font-weight: 700; }
input::placeholder, textarea::placeholder { color: #6E685B; }
select { appearance: none; -webkit-appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 11px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
.mmss { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-weight: 700; color: var(--chalk); }
.mmss input[type="number"] { padding: 8px 4px; text-align: center; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pick { display: flex; gap: 8px; flex-wrap: wrap; }
.pick .btn { min-height: 40px; padding: 6px 14px; font-size: 17px; }
.pick .btn[aria-pressed="true"] { background: var(--chalk); color: var(--iron); border-color: var(--chalk); }
.wl { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.wl span { min-width: 0; overflow-wrap: anywhere; }
.wl div { display: flex; gap: 6px; flex: none; }
.wl strong { font-family: var(--display); font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: .01em; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--gold); }
.logline { font-family: var(--mono); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

table { width: 100%; border-collapse: collapse; font-size: 15px; }
th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); }
th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.n { font-family: var(--mono); font-weight: 700; }
td.n:last-child { color: var(--gold); }
tr:last-child td { border-bottom: 0; }
.hist-lift { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }

/* rest timer docked above the tabs: rubber with a gold edge; flips to gold when rest is over */
.timer { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs-h) + env(safe-area-inset-bottom, 0px)); background: #0E0D09; color: var(--chalk); border-top: 3px solid var(--gold); z-index: 5; }
.timer-in { max-width: 520px; margin: 0 auto; padding: 8px 16px; display: flex; align-items: center; gap: 8px; }
.timer .clock { font-family: var(--mono); font-weight: 700; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; flex: 1; min-width: 0; }
.timer .clock small { display: block; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--chalk-dim); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.done { background: var(--gold); color: var(--iron); }
.trow.done .clock small { color: var(--iron); font-weight: 700; letter-spacing: .02em; }
.trow + .trow { border-top: 1px solid var(--plate); }
.timer.two .clock { font-size: 30px; }
body.two .app { padding-block-end: calc(var(--tabs-h) + 210px); }
.lname { font-family: var(--display); font-weight: 900; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
.lblock { display: flex; flex-direction: column; gap: 12px; }
.lblock + .lblock { border-top: 1px solid var(--line); padding-top: 12px; }
.prow { border-top: 1px solid var(--line); padding-top: 10px; }
.tpanel { gap: 10px; border-color: var(--line); border-left: 5px solid var(--red); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
.tline { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tline + .tline { border-top: 1px solid var(--line); padding-top: 10px; }
.tstat { font-family: var(--mono); font-weight: 700; font-size: 17px; text-transform: uppercase; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tstat.go { color: var(--gold); }
.timer button { min-width: 50px; height: 44px; border-radius: 2px; border: 2px solid currentColor; background: transparent; color: inherit; font-family: var(--mono); font-weight: 700; font-size: 14px; padding: 0 8px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--iron); border-top: 1px solid var(--plate); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
.tabs-in { max-width: 520px; margin: 0 auto; display: flex; height: var(--tabs-h); }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); font-family: var(--display); font-weight: 900; font-size: 19px; text-transform: uppercase; letter-spacing: .03em; border-top: 4px solid transparent; padding: 0 2px; }
.tabs button[aria-current="page"] { color: var(--chalk); border-top-color: var(--gold); }

/* set callouts: short, plain, earned */
.cheer { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 56px); transform: translateX(-50%); width: min(360px, calc(100% - 32px)); background: var(--rubber); color: var(--chalk); border: 1px solid var(--plate); border-left: 6px solid var(--gold); border-radius: 2px; padding: 12px 16px; z-index: 8; box-shadow: 0 12px 30px rgba(0,0,0,.55); animation: cheerIn .24s ease-out; }
.cheer.big { border-left: 10px solid var(--red); padding: 16px 18px; }
.cheer .ch { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.cheer.big .ch { font-size: 34px; color: var(--gold); }
.cheer .cm { font-size: 15px; margin-top: 5px; color: var(--chalk-dim); }
@keyframes cheerIn { from { opacity: 0; transform: translate(-50%, -14px); } to { opacity: 1; transform: translate(-50%, 0); } }
@media (prefers-reduced-motion: reduce) { .cheer { animation: none; } }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); background: var(--chalk); color: var(--iron); padding: 9px 16px; border-radius: 2px; font-weight: 600; font-size: 15px; z-index: 9; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
@media (max-width: 360px) { .wm { font-size: 38px; } .logo { width: 52px; height: 52px; } h1 { font-size: 40px; } .tabs button { font-size: 17px; } }
body { margin: 0; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><div class="wm" role="img" aria-label="Heavy Base"><span>Heavy</span><span>Base</span></div><div class="lock" aria-label="Heavy Base times FlyTy"><span class="x" aria-hidden="true">×</span><span class="logo"><img alt="FlyTy" src="icons/flyty.png" width="256" height="243"></span></div></div>
    <div class="stripes" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="tag">Be hard to move.</div>
    <div class="eyebrow" id="hdr-eyebrow"></div>
    <h1 id="hdr-title"></h1>
    <div class="prog" aria-hidden="true"><i id="hdr-prog"></i></div>
  </header>
  <main id="view"></main>
</div>

<div class="timer" id="timer" hidden>
  <div class="trow" id="trow-a"><div class="timer-in">
    <div class="clock"><small id="tl-a">Rest</small><span id="tc-a">3:00</span></div>
    <button type="button" data-act="t-adj" data-who="a" data-sign="-1" data-d="-15" aria-label="15 seconds less">−15</button>
    <button type="button" data-act="t-adj" data-who="a" data-sign="1" data-d="15" aria-label="15 seconds more">+15</button>
    <button type="button" data-act="t-skip" data-who="a">Skip</button>
  </div></div>
  <div class="trow" id="trow-p" hidden><div class="timer-in">
    <div class="clock"><small id="tl-p">Rest</small><span id="tc-p">3:00</span></div>
    <button type="button" data-act="t-adj" data-who="p" data-sign="-1" data-d="-15" aria-label="15 seconds less">−15</button>
    <button type="button" data-act="t-adj" data-who="p" data-sign="1" data-d="15" aria-label="15 seconds more">+15</button>
    <button type="button" data-act="t-skip" data-who="p">Skip</button>
  </div></div>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button type="button" data-act="tab" data-tab="today" id="tab-today">Workout</button>
    <button type="button" data-act="tab" data-tab="history" id="tab-history">History</button>
    <button type="button" data-act="tab" data-tab="program" id="tab-program">Program</button>
    <button type="button" data-act="tab" data-tab="settings" id="tab-settings">Settings</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>
<div class="cheer" id="cheer" hidden role="status" aria-live="polite"></div>

<script>
/*LOGIC*/
const LIB = {
  squat:    { name: 'Squat',             bar: true,  sets: 5, reps: 5,  inc: 5,   start: 135 },
  bench:    { name: 'Bench press',       bar: true,  sets: 5, reps: 5,  inc: 5,   start: 115 },
  clean:    { name: 'Power clean',       bar: true,  sets: 5, reps: 5,  inc: 5,   start: 95 },
  press:    { name: 'Overhead press',    bar: true,  sets: 5, reps: 5,  inc: 5,   start: 75 },
  deadlift: { name: 'Deadlift',          bar: true,  sets: 1, reps: 5,  inc: 10,  start: 185 },
  row:      { name: 'Barbell row',       bar: true,  sets: 5, reps: 5,  inc: 5,   start: 95 },
  fsquat:   { name: 'Front squat',       bar: true,  sets: 3, reps: 5,  inc: 5,   start: 95 },
  rdl:      { name: 'Romanian deadlift', bar: true,  sets: 3, reps: 8,  inc: 5,   start: 135 },
  incline:  { name: 'Incline bench',     bar: true,  sets: 3, reps: 8,  inc: 5,   start: 95 },
  cgbench:  { name: 'Close-grip bench',  bar: true,  sets: 3, reps: 8,  inc: 5,   start: 95 },
  thrust:   { name: 'Hip thrust',        bar: true,  sets: 3, reps: 8,  inc: 10,  start: 135 },
  lunge:    { name: 'Barbell lunge',     bar: true,  sets: 3, reps: 8,  inc: 5,   start: 65 },
  curl:     { name: 'Barbell curl',      bar: true,  sets: 3, reps: 8,  inc: 5,   start: 45 },
  chinup:   { name: 'Chin-up (added weight)', bar: false, sets: 3, reps: 8, inc: 2.5, start: 0 },
  dip:      { name: 'Dip (added weight)',     bar: false, sets: 3, reps: 8, inc: 2.5, start: 0 },
  dbpress:  { name: 'Dumbbell press',    bar: false, sets: 3, reps: 8,  inc: 5,   start: 40 },
  pulldown: { name: 'Lat pulldown',      bar: false, sets: 3, reps: 10, inc: 5,   start: 100 },
  legpress: { name: 'Leg press',         bar: false, sets: 3, reps: 10, inc: 10,  start: 180 },
  /* Bodyweight lifts. They add reps per set instead of weight: `step` reps every `every` weeks until `target`. */
  pullup:   { name: 'Pull-up',               kind: 'bw', bar: false, sets: 3, reps: 5,  inc: 0, start: 0, target: 10, step: 1, every: 1 },
  chin:     { name: 'Chin-up',               kind: 'bw', bar: false, sets: 3, reps: 5,  inc: 0, start: 0, target: 10, step: 1, every: 1 },
  widepu:   { name: 'Wide-grip pull-up',     kind: 'bw', bar: false, sets: 3, reps: 4,  inc: 0, start: 0, target: 8,  step: 1, every: 1 },
  neutralpu:{ name: 'Neutral-grip pull-up',  kind: 'bw', bar: false, sets: 3, reps: 5,  inc: 0, start: 0, target: 10, step: 1, every: 1 },

document.addEventListener('click', e => {

/* ---------- standalone site: backup / restore and offline ---------- */
async function backup() {
  const name = 'heavy-base-' + new Date().toISOString().slice(0, 10) + '.json';
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  try { const f = new File([blob], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Heavy Base backup' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }

document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('button[data-act="backup"]'); if (el) backup(); });
document.addEventListener('change', e => {
